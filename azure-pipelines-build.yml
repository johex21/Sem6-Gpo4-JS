trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'sc-acr-devops'
  imageRepository: 'app-web-duoc'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildAndPush
  displayName: 'Stage Build & Push'
  jobs:
  - job: BuildJob
    displayName: 'Construir y Publicar Imagen en ACR'
    steps:
    - task: Docker@2
      displayName: 'Build de imagen Docker'
      inputs:
        command: 'build'
        repository: '$(imageRepository)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push de imagen hacia Azure Container Registry'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(tag)
          latest
