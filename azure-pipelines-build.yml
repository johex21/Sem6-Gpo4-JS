trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'sc-acr-devops'
  imageRepository: 'app-web-duoc'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildAndPush
  displayName: 'Stage Build & Push'
  jobs:
  - job: BuildJob
    displayName: 'Construir y Publicar Imagen en ACR'
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)
          latest
