
trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  sshConnection: 'sc-vm-docker'
  containerName: 'contenedor-web-eval2'

stages:
- stage: DeployStage
  displayName: 'Stage Deployment VM'
  jobs:
  - job: SSHDeployJob
    displayName: 'Despliegue de Contenedor en VM Linux'
    steps:
    - task: SSH@0
      displayName: 'Ejecutar despliegue Docker en host remoto'
      inputs:
        sshEndpoint: '$(sshConnection)'
        runOptions: 'inline'
        inline: |
          echo "=== 1. Deteniendo y eliminando contenedor previo si existe ==="
          sudo docker rm -f $(containerName) || true

          echo "=== 2. Iniciando nuevo contenedor web ==="
          sudo docker run -d \
            --name $(containerName) \
            -p 80:80 \
            --restart always \
            nginx:alpine

          echo "=== 3. Comprobacion de estado del contenedor ==="
          sudo docker ps -f name=$(containerName)
